    function getFormattedCountryTime(tz) {
      const now = new Date();
      try {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: tz,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).formatToParts(now);

        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const hr = map.hour === '24' ? '00' : map.hour;

        const tzPart = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          timeZoneName: 'shortOffset'
        }).formatToParts(now).find(p => p.type === 'timeZoneName');

        const offset = tzPart ? tzPart.value.replace('GMT', 'UTC') : tz;
        return {
          time: `${hr}:${map.minute}:${map.second}`,
          date: `${map.year}-${map.month}-${map.day}`,
          offset
        };
      } catch (e) {
        return {
          time: now.toISOString().slice(11, 19),
          date: now.toISOString().slice(0, 10),
          offset: 'UTC'
        };
      }
    }

      tvClock.textContent = formatted.time;
      tvDate.textContent = formatted.date;
      tvTz.textContent = formatted.offset;
      timeViewer.classList.add('visible');

      const pts = [];

    for (let lon = 0; lon < 360; lon += 15) {

      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    const nodeHaloGeo = new THREE.RingGeometry(1.3, 2.2, 20);
    const nodeHaloMat = new THREE.MeshBasicMaterial({
      color: 0x00ff66,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.55
    });

    COUNTRIES_DATA.forEach((country) => {
      const pos = latLonToVector3(country.lat, country.lon, GLOBE_RADIUS + 0.65);
      const marker = new THREE.Group();
      marker.position.copy(pos);
      marker.lookAt(pos.clone().multiplyScalar(2));

      const dot = new THREE.Mesh(nodeCoreGeo, nodeCoreMat);
      const halo = new THREE.Mesh(nodeHaloGeo, nodeHaloMat.clone());
      marker.add(dot);
      marker.add(halo);
      marker.userData = { countryId: country.id, halo };

      nodesGroup.add(marker);
      nodeMeshes.set(country.id, marker);
    });

    brandFoxdie.addEventListener('click', () => {
      nodesVisible = !nodesVisible;
      brandFoxdie.classList.toggle('active', nodesVisible);
      document.body.classList.toggle('nodes-active', nodesVisible);
      nodesGroup.visible = nodesVisible;
      atmosMat.uniforms.glowColor.value.setHex(nodesVisible ? 0x00ff66 : 0xffffff);
    });

    const bordersGroup = new THREE.Group();
    const highlightGroup = new THREE.Group();
    globeGroup.add(bordersGroup);
    globeGroup.add(highlightGroup);

    const countryBorderLines = new Map();
    const countryPolygons = [];

    const defaultBorderMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.24
    });

    const highlightBorderMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 1.0
    });

    const highlightFillMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.16,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    let activeHighlightMeshes = [];

    function pointInRing(lon, lat, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / (yj - yi + 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function findCountryAtLatLon(lat, lon) {
      for (let i = 0; i < countryPolygons.length; i++) {
        const entry = countryPolygons[i];
        if (lat < entry.bbox.minLat || lat > entry.bbox.maxLat ||
            lon < entry.bbox.minLon || lon > entry.bbox.maxLon) {
          continue;
        }
        for (const poly of entry.polygons) {
          if (pointInRing(lon, lat, poly[0])) {
            let inHole = false;
            for (let h = 1; h < poly.length; h++) {
              if (pointInRing(lon, lat, poly[h])) {
                inHole = true;
                break;
              }
            }
            if (!inHole) return entry.id;
          }
        }
      }
      let closestId = null;
      let minDist = 4.2;
      COUNTRIES_DATA.forEach(c => {
        const d = Math.hypot(c.lat - lat, c.lon - lon);
        if (d < minDist) {
          minDist = d;
          closestId = c.id;
        }
      });
      return closestId;
    }

    function buildCountryHighlight(countryId) {
      activeHighlightMeshes.forEach(m => highlightGroup.remove(m));
      activeHighlightMeshes = [];

      if (!countryId) return;

      const lines = countryBorderLines.get(countryId);
      if (lines) {
        lines.forEach(line => {
          const clone = new THREE.Line(line.geometry, highlightBorderMat);
          clone.scale.setScalar(1.003);
          highlightGroup.add(clone);
          activeHighlightMeshes.push(clone);
        });
      }

      const polyEntry = countryPolygons.find(p => p.id === countryId);
      if (polyEntry) {
        highlightFillMat.color.setHex(nodesVisible ? 0x00ff66 : 0xffffff);
        highlightBorderMat.color.setHex(nodesVisible ? 0x00ff66 : 0xffffff);

        polyEntry.polygons.forEach(poly => {
          const outer = poly[0];
          if (outer.length < 3) return;
          const shape = new THREE.Shape();
          outer.forEach((pt, idx) => {
            if (idx === 0) shape.moveTo(pt[0], pt[1]);
            else shape.lineTo(pt[0], pt[1]);
          });
          const geom2d = new THREE.ShapeGeometry(shape);
          const posAttr = geom2d.attributes.position;
          for (let i = 0; i < posAttr.count; i++) {
            const lon = posAttr.getX(i);
            const lat = posAttr.getY(i);
            const v = latLonToVector3(lat, lon, GLOBE_RADIUS + 0.25);
            posAttr.setXYZ(i, v.x, v.y, v.z);
          }
          geom2d.computeVertexNormals();
          const mesh = new THREE.Mesh(geom2d, highlightFillMat);
          highlightGroup.add(mesh);
          activeHighlightMeshes.push(mesh);
        });
      }
    }

    function setHoveredCountry(countryId, scrollSidebar = true) {
      const effectiveId = countryId || selectedCountryId;

      if (hoveredCountryId === countryId && effectiveId === (hoveredCountryId || selectedCountryId)) {
        updateTimeViewer();
        return;
      }

      listItemsById.forEach((el, id) => {
        el.classList.toggle('highlighted', id === countryId || id === selectedCountryId);
      });

      hoveredCountryId = countryId;

      if (effectiveId && countryMap.has(effectiveId)) {
        const c = countryMap.get(effectiveId);
        buildCountryHighlight(effectiveId);

        if (countryId && !isWebsitesMode) {
          tagName.textContent = c.name.toUpperCase();
          const latDir = c.lat >= 0 ? 'N' : 'S';
          const lonDir = c.lon >= 0 ? 'E' : 'W';
          tagCoords.textContent = `${Math.abs(c.lat).toFixed(2)}°${latDir}  ${Math.abs(c.lon).toFixed(2)}°${lonDir}`;
          floatingTag.classList.add('visible');
        } else {
          floatingTag.classList.remove('visible');
        }

        if (scrollSidebar && countryId && !isWebsitesMode) {
          const itemEl = listItemsById.get(countryId);
          if (itemEl) {
            itemEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      } else {
        buildCountryHighlight(null);
        floatingTag.classList.remove('visible');
      }

      updateTimeViewer();
    }

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(res => res.json())
      .then(world => {
        const countriesGeo = topojson.feature(world, world.objects.countries);

        countriesGeo.features.forEach(feature => {
          const rawId = String(feature.id || '').padStart(3, '0');
          const geom = feature.geometry;
          if (!geom) return;

          const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
          const linesList = [];

          let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;

          polys.forEach(poly => {
            poly.forEach((ring, rIdx) => {
              const pts = [];
              ring.forEach(([lon, lat]) => {
                if (rIdx === 0) {
                  if (lat < minLat) minLat = lat;
                  if (lat > maxLat) maxLat = lat;
                  if (lon < minLon) minLon = lon;
                  if (lon > maxLon) maxLon = lon;
                }
                pts.push(latLonToVector3(lat, lon, GLOBE_RADIUS + 0.12));
              });
              const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
              const line = new THREE.Line(lineGeo, defaultBorderMat);
              bordersGroup.add(line);
              linesList.push(line);
            });
          });

          if (countryMap.has(rawId)) {
            countryBorderLines.set(rawId, linesList);
            countryPolygons.push({
              id: rawId,
              polygons: polys,
              bbox: { minLat, maxLat, minLon, maxLon }
            });
          }
        });
      });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let isDragging = false;
    let dragMoved = false;
    let prevMouse = { x: 0, y: 0 };

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragMoved = false;
      autoRotate = false;
      targetRotationY = null;
      targetRotationX = null;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    canvas.addEventListener('click', () => {
      if (dragMoved) return;
      if (hoveredCountryId) {
        selectedCountryId = hoveredCountryId;
        setHoveredCountry(hoveredCountryId, true);
        updateTimeViewer();
      }
    });

    window.addEventListener('pointermove', (e) => {
      floatingTag.style.left = `${e.clientX}px`;
      floatingTag.style.top = `${e.clientY}px`;

      if (isDragging) {
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
        globeGroup.rotation.y += dx * 0.005;
        globeGroup.rotation.x = Math.max(-1.1, Math.min(1.1, globeGroup.rotation.x + dy * 0.005));
        prevMouse = { x: e.clientX, y: e.clientY };
        return;
      }

      if (e.target !== canvas) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObject(coreMesh);

      if (intersects.length > 0) {
        const localPt = globeGroup.worldToLocal(intersects[0].point.clone());
        const r = localPt.length();
        const lat = 90 - Math.acos(Math.max(-1, Math.min(1, localPt.y / r))) * (180 / Math.PI);
        const theta = Math.atan2(localPt.z, -localPt.x);
        let lon = theta * (180 / Math.PI) - 180;
        if (lon < -180) lon += 360;
        if (lon > 180) lon -= 360;

        const hitId = findCountryAtLatLon(lat, lon);
        setHoveredCountry(hitId, true);
        canvas.style.cursor = hitId ? 'pointer' : 'grab';
      } else {
        setHoveredCountry(null, false);
        canvas.style.cursor = 'grab';
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      camera.position.z = Math.max(155, Math.min(440, camera.position.z + e.deltaY * 0.18));
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (autoRotate && !isDragging && !hoveredCountryId && !selectedCountryId) {
        globeGroup.rotation.y += 0.0014;
      } else if (targetRotationY !== null && !isDragging) {
        let diffY = targetRotationY - globeGroup.rotation.y;
        while (diffY > Math.PI) diffY -= Math.PI * 2;
        while (diffY < -Math.PI) diffY += Math.PI * 2;
        globeGroup.rotation.y += diffY * 0.08;
        globeGroup.rotation.x += (targetRotationX - globeGroup.rotation.x) * 0.08;
      }

      if (nodesVisible) {
        const pulse = 0.85 + Math.sin(elapsed * 4.0) * 0.25;
        nodeMeshes.forEach((marker, id) => {
          const isFocus = id === hoveredCountryId || id === selectedCountryId;
          const s = isFocus ? 1.85 : pulse;
          marker.userData.halo.scale.set(s, s, 1);
          marker.userData.halo.material.opacity = isFocus ? 0.95 : 0.45;
        });
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
